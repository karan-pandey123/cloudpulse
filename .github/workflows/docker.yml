name: Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t cloudpulse-backend ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t cloudpulse-frontend ./frontend